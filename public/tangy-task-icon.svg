<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bgGrad)"/>
  <!-- Bold T letter -->
  <text
    x="256"
    y="340"
    text-anchor="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="320"
    fill="white"
  >T</text>
  <!-- Yellow diagonal accent line through T -->
  <line x1="200" y1="200" x2="310" y2="320" stroke="#FFD700" stroke-width="18" stroke-linecap="round"/>
</svg>
